name: Button
icon: url
preview: pure-button

fields:
  link:
    label: Content
    type: link
    width: 1/2

  text:
    label: Text
    type: text
    width: 1/2

  fontSize:
    label: Font Size
    type: select
    default: s
    empty: false
    width: 1/4
    options:
      xxs: XXS
      xs: XS
      s: S
      sm: SM
      m: M
      ml: ML
      l: L
      xl: XL
      xxl: XXL
      3xl: 3XL
      4xl: 4XL
