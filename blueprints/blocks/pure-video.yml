name: Pure Video
icon: video
preview: pure-video

fields:
  location:
    label: field.blocks.video.location
    type: radio
    columns: 2
    default: kirby
    options:
      kirby: "{{ t('field.blocks.image.location.internal') }}"
      web: "{{ t('field.blocks.image.location.external') }}"

  url:
    label: field.blocks.video.url.label
    type: url
    placeholder: field.blocks.video.url.placeholder
    when:
      location: web

  video:
    label: field.blocks.video.name
    type: files
    query: model.videos
    multiple: false
    when:
      location: kirby

  poster:
    label: field.blocks.video.poster
    type: files
    query: model.images
    multiple: false
    image:
      back: black
    uploads:
      template: blocks/image

  dimensions:
    label: Dimensions
    type: group
    fields:
      width:
        label: Width
        type: number
        after: px
        width: 1/3
        min: 1
        step: 1
        placeholder: e.g. 1920
        when:
          location: kirby

      height:
        label: Height
        type: number
        after: px
        width: 1/3
        min: 1
        step: 1
        placeholder: e.g. 1080
        when:
          location: kirby

      corners:
        extends: fields/corners

  autoplay:
    label: field.blocks.video.autoplay
    type: toggle
    width: 1/3
    default: true
    when:
      location: kirby

  muted:
    label: field.blocks.video.muted
    type: toggle
    width: 1/3
    default: true
    when:
      location: kirby

  loop:
    label: field.blocks.video.loop
    type: toggle
    width: 1/3
    default: true
    when:
      location: kirby

  controls:
    label: field.blocks.video.controls
    type: toggle
    width: 1/3
    default: false
    when:
      location: kirby

  linkObject:
    label: Link
    type: object
    fields:
      link:
        label: Link
        type: link
      target:
        label: Open in new window?
        type: toggle
        text:
          - "No"
          - "Yes"
    when:
      location: kirby

  captionHeadline:
    label: Caption
    type: headline

  caption:
    label: field.blocks.video.caption
    type: writer
    inline: true

  captionTextAlign:
    label: Caption Alignment
    extends: fields/text-align

  anchor:
    extends: fields/anchor
