title: Pure Page

tabs:
  content:
    label: Content
    icon: file-document
    columns:
      main:
        width: 2/3
        sections:
          fields:
            type: fields
            fields:

              pageBuilder:
                extends: groups/page-builder

      sidebar:
        width: 1/3
        sections:
          pages:
            type: pages
            template: pure-subpage
            limit: 100
            info: "{{ page.date.toDate('d M Y') }}"

          files:
            type: files

  seo:
    label: Page SEO
    icon: search
    columns:
      main:
        width: 2/3
        sections:

          seo:
            extends: sections/pure-page-seo